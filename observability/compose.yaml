# A local Prometheus and Grafana for trying the canary metrics. Not a production setup.
#
#   docker compose -f observability/compose.yaml up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:9090/api/v1/otlp ./gradlew :pineapplemonitor-example:bootRun
#
# Then open http://localhost:3000.
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Accepts OTLP metrics at /api/v1/otlp/v1/metrics, so no collector is needed.
      - --web.enable-otlp-receiver
      - --enable-feature=created-timestamp-zero-ingestion
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:9090:9090

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      # Anyone who can reach the port can view, which is fine for a local demo only.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/canary.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - prometheus
